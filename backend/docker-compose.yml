services:
  db:
    image: postgres:18-alpine
    container_name: coleta-mais-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_EXT_PORT:-5432}:${DB_PORT:-5432}"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-coletamais}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - coleta-mais-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coleta-mais-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
    ports:
      - "${SERVER_PORT:-8080}:8080"
    networks:
      - coleta-mais-network

volumes:
  postgres_data:
    name: coleta-mais-postgres-data

networks:
  coleta-mais-network:
    external: true
    name: coleta-mais-network